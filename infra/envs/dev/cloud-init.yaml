#cloud-config
# EJEMPLO DOCUMENTAL. ATENCIÓN: aún no está conectado a main.tf ni aplicado.
# Requiere que el proveedor de Proxmox cargue este archivo como user-data.
ssh_pwauth: false
disable_root: true
write_files:
  - path: /etc/ssh/sshd_config.d/99-logiandes.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      AllowUsers ubuntu
runcmd:
  - systemctl reload ssh
